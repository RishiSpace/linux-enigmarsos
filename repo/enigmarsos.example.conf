# Pacman repository for linux-enigmarsos.
# Copy to /etc/pacman.d/linux-enigmarsos.conf and Include it from
# pacman.conf, or paste the section into pacman.conf directly.
#
# GitHub Releases are the $0 mirror. Pacman follows redirects from
# /releases/latest/download/<filename> to the Latest release assets.
# Every published release MUST include linux-enigmarsos.db (regular
# file, not only a symlink) plus the .pkg.tar.zst packages.

[linux-enigmarsos]
SigLevel = Optional TrustAll
Server = https://github.com/RishiSpace/linux-enigmarsos/releases/latest/download

# Local tree from ./scripts/publish-repo.sh:
# Server = file:///srv/repo/linux-enigmarsos/os/x86_64
