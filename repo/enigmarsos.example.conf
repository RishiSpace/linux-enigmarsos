# Example pacman repository snippet for linux-enigmarsos.
# Copy to /etc/pacman.d/linux-enigmarsos.conf and Include it from
# pacman.conf, or paste the section into pacman.conf directly.
#
# Replace the Server URL with the real EnigmarsOS repo once it exists.
# For a local tree produced by scripts/publish-repo.sh, use file://.

[linux-enigmarsos]
SigLevel = Optional TrustAll
Server = https://repo.enigmarsos.example/$repo/os/$arch
# Server = file:///srv/repo/linux-enigmarsos/os/$arch
